<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Tour Virtual 360°</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>

<body class="landing">

<!-- 🖼️ FUNDO ANIMADO (capa do cliente, com efeito de deslize simulando movimento) -->
<div id="landing-bg" aria-hidden="true">
  <div id="landing-bg-img"></div>
</div>

<!-- 🔒 LANDING / SENHA -->
<div class="landing-box" id="landing">

  <div class="marca-estudio marca-estudio--landing">
    <span class="marca-estudio__studio">Studio</span>
    <img src="assets/logo-edipo3d.png" alt="Studio Édipo3D" class="marca-estudio__img">
  </div>

  <div id="step-password">
    <h1>Tour Virtual 360°</h1>
    <p>Digite a senha para acessar</p>

    <div class="password-wrapper">
      <input type="password" id="password" class="input-password" placeholder="Senha">
      <button type="button" id="toggle-senha" class="toggle-senha-btn" aria-label="Mostrar senha">👁</button>
    </div>
    <button class="btn" onclick="entrar()">Entrar no Tour</button>
  </div>

</div>

<!-- 🎬 CAPA / INICIAR TOUR -->
<div id="cover">
  <img id="cover-img" src="" alt="Capa do tour">
  <div id="cover-overlay">
    <button class="btn btn-play" id="play-btn" onclick="entrarNoTour()">▶ Iniciar Tour</button>
  </div>
</div>

<!-- ⏳ LOADER -->
<div id="loader">
  <div class="spinner"></div>
  <p>Carregando tour...</p>
</div>

<!-- 🌐 TOUR -->
<div id="tour">

  <div id="menu">
    <strong>Cenas</strong>
  </div>

  <div id="panorama"></div>

  <!-- 🏷️ MARCA DO ESTÚDIO (discreta, fixa, não atrapalha a visualização) -->
  <div class="marca-estudio marca-estudio--tour" aria-hidden="true">
    <span class="marca-estudio__studio">Studio</span>
    <img src="assets/logo-edipo3d.png" alt="" class="marca-estudio__img">
  </div>

  <!-- 🎯 PAINEL DO EDITOR DE POSIÇÃO (só aparece com ?editor=1 na URL) -->
  <div id="editor-panel" style="display:none;">
    <div class="editor-panel-cabecalho">
      <strong>🎯 Editor de posição &amp; hotspots</strong>
      <button type="button" id="btn-recolher-editor" class="editor-panel-btn-recolher" onclick="alternarPainelEditor()" aria-label="Recolher painel do editor" aria-expanded="true">−</button>
    </div>
    <div class="editor-panel-conteudo">
    <span id="editor-status">carregando...</span>
    <div class="editor-panel-botoes">
      <button type="button" onclick="salvarPosicaoAtual()">💾 Salvar posição desta cena</button>
      <button type="button" onclick="copiarBlocoConfig()">📋 Copiar posições</button>
    </div>
    <div class="editor-panel-botoes">
      <button type="button" id="btn-modo-hotspot" onclick="alternarModoHotspot()">🔗 Ativar modo hotspot</button>
      <button type="button" onclick="copiarBlocoHotspots()">📋 Copiar hotspots</button>
    </div>
    <div class="editor-panel-botoes">
      <button type="button" onclick="copiarBlocoTitulos()">📋 Copiar títulos</button>
      <button type="button" onclick="copiarOrdemGaleria()">📋 Copiar ordem da galeria</button>
    </div>
    <section class="editor-ambientes" aria-labelledby="editor-ambientes-titulo">
      <span id="editor-ambientes-titulo">Ambientes — renomear e ordenar galeria</span>
      <div id="editor-lista-ambientes"></div>
    </section>
    <small class="editor-panel-dica">
      Com Modo hotspot ativo: arraste a alça ↕ do marcador para mover · botão direito apaga
    </small>
    </div>
  </div>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>

<script src="config.js"></script>
<script src="transicoes.js"></script>
<script src="scenes.js"></script>
<script src="viewer.js"></script>
<script src="menu.js"></script>
<script src="keyboard.js"></script>
<script src="navigation.js"></script>
<script src="editor.js"></script>

<!-- CONTROLE DE ENTRADA -->
<script>
const VALIDADE_LOGIN_MS = 24 * 60 * 60 * 1000; // 24 horas

function loginAindaValido() {
  const expiraEm = Number(localStorage.getItem("tourAuthExpira") || 0);
  return Boolean(expiraEm) && Date.now() < expiraEm;
}

function definirFundoAnimado() {
  const camada = document.getElementById('landing-bg-img');
  const imagem = CONFIG.capa || `${CONFIG.pasta}1.${CONFIG.extensao}`;
  camada.style.backgroundImage = `url("${imagem}")`;
}

function mostrarCapa() {
  document.getElementById('landing').style.display = "none";
  document.getElementById('landing-bg').style.display = "none";

  const capaImg = document.getElementById('cover-img');
  capaImg.src = CONFIG.capa || `${CONFIG.pasta}1.${CONFIG.extensao}`;

  document.getElementById('cover').style.display = "flex";
}

function entrarNoTour() {
  document.getElementById('cover').style.display = "none";
  document.getElementById('loader').style.display = "flex";

  setTimeout(() => {
    document.getElementById('loader').style.display = "none";
    document.getElementById('tour').style.display = "block";

    // inicia o tour AGORA
    iniciarTour();
    iniciarEditorPosicao();

    document.documentElement.requestFullscreen?.();
  }, 1200);
}

function entrar() {
  const senha = document.getElementById('password').value;

  if (senha !== CONFIG.senha) {
    alert("Senha incorreta");
    return;
  }

  localStorage.setItem("tourAuthExpira", String(Date.now() + VALIDADE_LOGIN_MS));
  mostrarCapa();
}

// alterna mostrar/ocultar a senha digitada
document.getElementById('toggle-senha').addEventListener('click', () => {
  const input = document.getElementById('password');
  const btn = document.getElementById('toggle-senha');
  const visivel = input.type === "text";

  input.type = visivel ? "password" : "text";
  btn.textContent = visivel ? "👁" : "🙈";
  btn.setAttribute('aria-label', visivel ? "Mostrar senha" : "Ocultar senha");
});

definirFundoAnimado();

// login ainda dentro das 24h -> pula direto pra capa, senao pede senha de novo
if (loginAindaValido()) {
  mostrarCapa();
}
</script>


</body>
</html>
