<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Tour Virtual 360°</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css">
</head>

<body class="landing">

<!-- 🔒 LANDING / SENHA -->
<div class="landing-box" id="landing">

  <!-- ETAPA 1: escolha do modo -->
  <div id="step-device">
    <h1>Tour Virtual 360°</h1>
    <p>Escolha como você vai visualizar</p>

    <div class="device-options">
      <button class="device-btn" data-device="pc">
        <span class="device-icon">💻</span>
        <span>Computador</span>
      </button>
      <button class="device-btn" data-device="mobile">
        <span class="device-icon">📱</span>
        <span>Celular</span>
      </button>
    </div>
  </div>

  <!-- ETAPA 2: senha -->
  <div id="step-password" style="display:none;">
    <h1>Tour Virtual 360°</h1>
    <p>Digite a senha para acessar</p>

    <div class="password-wrapper">
      <input type="password" id="password" class="input-password" placeholder="Senha">
      <button type="button" id="toggle-senha" class="toggle-senha-btn" aria-label="Mostrar senha">👁</button>
    </div>
    <button class="btn" onclick="entrar()">Entrar no Tour</button>
  </div>

</div>

<!-- 🎬 CAPA / INICIAR TOUR -->
<div id="cover">
  <img id="cover-img" src="" alt="Capa do tour">
  <div id="cover-overlay">
    <button class="btn btn-play" id="play-btn" onclick="entrarNoTour()">▶ Iniciar Tour</button>
  </div>
</div>

<!-- ⏳ LOADER -->
<div id="loader">
  <div class="spinner"></div>
  <p>Carregando tour...</p>
</div>

<!-- 🌐 TOUR -->
<div id="tour">

  <div id="menu">
    <strong>Cenas</strong>
  </div>

  <div id="back-btn" onclick="sairDoTour()" aria-label="Voltar e trocar modo de visualização">↩</div>

  <div id="help-btn">Ajuda ⓘ</div>

  <div id="help-modal">
    <div id="help-content">
      <h2>Controles</h2>
      <ul>
        <li>Arraste para olhar</li>
        <li>Scroll para zoom</li>
        <li>← → trocar cena</li>
      </ul>
      <button id="close-help">Fechar</button>
    </div>
  </div>

  <div id="panorama"></div>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>

<script src="config.js"></script>
<script src="scenes.js"></script>
<script src="viewer.js"></script>
<script src="menu.js"></script>
<script src="keyboard.js"></script>
<script src="help.js"></script>
<script src="navigation.js"></script>
<script src="device.js"></script>

<!-- CONTROLE DE ENTRADA -->
<script>
function mostrarCapa() {
  document.getElementById('landing').style.display = "none";

  const capaImg = document.getElementById('cover-img');
  capaImg.src = CONFIG.capa || `${CONFIG.pasta}1.${CONFIG.extensao}`;

  document.getElementById('cover').style.display = "flex";
}

function entrarNoTour() {
  document.getElementById('cover').style.display = "none";
  document.getElementById('loader').style.display = "flex";

  setTimeout(() => {
    document.getElementById('loader').style.display = "none";
    document.getElementById('tour').style.display = "block";

    // inicia o tour AGORA
    iniciarTour();

    document.documentElement.requestFullscreen?.();
  }, 1200);
}

function entrar() {
  const senha = document.getElementById('password').value;

  if (senha !== CONFIG.senha) {
    alert("Senha incorreta");
    return;
  }

  localStorage.setItem("tourAuth", "ok");
  mostrarCapa();
}

// alterna mostrar/ocultar a senha digitada
document.getElementById('toggle-senha').addEventListener('click', () => {
  const input = document.getElementById('password');
  const btn = document.getElementById('toggle-senha');
  const visivel = input.type === "text";

  input.type = visivel ? "password" : "text";
  btn.textContent = visivel ? "👁" : "🙈";
  btn.setAttribute('aria-label', visivel ? "Mostrar senha" : "Ocultar senha");
});

// já escolheu dispositivo e já logou antes -> pula direto pra capa (senha nao pede de novo)
if (localStorage.getItem("tourAuth") === "ok") {
  aplicarDevice(localStorage.getItem("tourDevice") || "pc");
  mostrarCapa();
} else if (localStorage.getItem("tourDevice")) {
  // já escolheu dispositivo antes, mas ainda não logou -> pula direto pra senha
  document.getElementById('step-device').style.display = "none";
  document.getElementById('step-password').style.display = "block";
}
</script>


</body>
</html>
